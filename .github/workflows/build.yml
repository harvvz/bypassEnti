name: Compile iOS dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Dependências (ldid, xz)
        run: brew install ldid xz

      - name: Configurar Theos
        uses: Randomblock1/theos-action@v1

      - name: Compilar Projeto
        run: |
          make FINALPACKAGE=1 DEBUG=0

      - name: Listar arquivos gerados (para debug)
        if: always()
        run: |
          echo "Conteúdo da raiz:"
          ls -la
          echo "Conteúdo da pasta .theos se existir:"
          ls -la .theos/ || true
          echo "Conteúdo da pasta packages se existir:"
          ls -la packages/ || true

      - name: Salvar Artefato (.dylib / .deb)
        uses: actions/upload-artifact@v4
        with:
          name: bypassEnti-binarios
          path: |
            .theos/_/*.dylib
            packages/*.deb
            obj/**/*.dylib
            *.dylib
